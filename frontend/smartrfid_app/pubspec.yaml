name: smartrfid_app
description: "Sistema de gestión de inventario con tecnología RFID y códigos de barras para MASSLINE"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # HTTP Client
  dio: ^5.4.0
  http: ^1.1.2
  
  # Network & Caching
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.9.0

  # JSON Serialization
  json_annotation: ^4.8.1

  # Network Info
  connectivity_plus: ^5.0.2

  # Device Info - Versiones compatibles
  device_info_plus: ^9.1.2
  package_info_plus: ^4.2.0

  # Permissions
  permission_handler: ^11.1.0

  # Camera & Barcode Scanning
  camera: ^0.10.5+9
  mobile_scanner: ^3.5.7
  qr_code_scanner: ^1.0.1

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  lottie: ^3.0.0

  # Date & Time
  intl: ^0.19.0

  # Utils
  uuid: ^4.3.3
  crypto: ^3.0.3
  convert: ^3.1.1

  # File Handling
  file_picker: ^6.1.1
  open_file: ^3.3.2
  path_provider: ^2.1.2

  # Toast & Snackbars
  fluttertoast: ^8.2.4

  # Pull to Refresh
  pull_to_refresh: ^2.0.0

  # Charts (for reports)
  fl_chart: ^0.66.0

  # QR Code Generation
  qr_flutter: ^4.1.0

  # Image Processing
  image: ^4.1.7

  # Logging
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Code Generation
  json_serializable: ^6.7.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/config/

